name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.14"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: dashboard/.node-version
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install pinned Python tooling
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.19
          uv sync --frozen

      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard --ignore-scripts

      - name: Static validation
        run: uv run harness-test validate

      - name: Lint
        run: uv run ruff check src tests

      - name: Unit tests
        run: uv run pytest -q tests/unit

      - name: Dashboard
        run: |
          npm --prefix dashboard test
          npm --prefix dashboard run build
