schema_version = "1.4"

artifacts = [
  { source = "/app", destination = "workspace", exclude = [".git", "node_modules", "target"] },
  { source = "/logs/agent/trajectory.json", destination = "trajectory.json" },
  { source = "/var/log/harness/Events.jsonl", service = "harness-stub" },
]

[task]
name = "studio-moser/missing-rubric"
version = "1.0.0"
description = "Measures typed blocking when the documented model rubric is absent."
authors = [{ name = "Studio Moser" }]
keywords = ["harness", "contract", "routing", "blocker"]

[metadata]
difficulty = "medium"
category = "contract"
tags = ["harness", "contract", "routing", "blocker"]
change_class = "feature"
verification_envelope = "contract"
fixture_digest = "sha256:903179738b1e667a82de2105a1413a49fedccec203f586b6898220ea2dcda0f1"

[agent]
timeout_sec = 900.0
network_mode = "allowlist"
allowed_hosts = []

[environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []
workdir = "/app"

[verifier]
timeout_sec = 180.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
