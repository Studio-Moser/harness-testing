schema_version = "1.4"

artifacts = [
  { source = "/app", destination = "workspace", exclude = [".git", "node_modules", "target"] },
  { source = "/logs/agent/trajectory.json", destination = "trajectory.json" },
  { source = "/var/log/harness/Events.jsonl", service = "harness-stub" },
]

[task]
name = "studio-moser/fixed-target-independent-review"
version = "1.0.0"
description = "Measures immutable, fresh-context independent review and proof reproduction."
authors = [{ name = "Studio Moser" }]
keywords = ["harness", "contract", "review", "fixed-target"]

[metadata]
difficulty = "medium"
category = "contract"
tags = ["harness", "contract", "review", "fixed-target"]
change_class = "feature"
verification_envelope = "contract"
fixture_digest = "sha256:82788741f0fd8fb1398a57b203b0449280e653cd08397a12a5b008bb03e22397"

[agent]
timeout_sec = 900.0
network_mode = "allowlist"
allowed_hosts = []

[environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []
workdir = "/app"

[verifier]
timeout_sec = 180.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
