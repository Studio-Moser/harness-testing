schema_version = "1.4"

artifacts = [
  { source = "/app", destination = "workspace", exclude = [".git", "node_modules", "target"] },
  { source = "/logs/agent/trajectory.json", destination = "trajectory.json" },
  { source = "/var/log/harness/Events.jsonl", service = "harness-stub" },
]

[task]
name = "studio-moser/missing-shelby"
version = "1.0.0"
description = "Measures non-blocking execution when optional Shelby memory is absent."
authors = [{ name = "Studio Moser" }]
keywords = ["harness", "contract", "shelby", "optional-capability"]

[metadata]
difficulty = "medium"
category = "contract"
tags = ["harness", "contract", "shelby", "optional-capability"]
change_class = "feature"
verification_envelope = "contract"
fixture_digest = "sha256:936d889e7a44fea89b65ac5fc13b099654331d0fc6b5c939495445861de88b2a"

[agent]
timeout_sec = 900.0
network_mode = "allowlist"
allowed_hosts = []

[environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []
workdir = "/app"

[verifier]
timeout_sec = 180.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
