schema_version = "1.4"

artifacts = [
  { source = "/app", destination = "workspace", exclude = [".git", "node_modules", "target"] },
  { source = "/logs/agent/trajectory.json", destination = "trajectory.json" },
]

[task]
name = "studio-moser/rust-quoted-value-parser"
version = "1.0.0"
description = "Measures a focused Rust parser fix with named and package-level proof."
authors = [{ name = "Studio Moser" }]
keywords = ["rust", "parser", "bugfix", "testing-churn"]

[metadata]
difficulty = "easy"
category = "workflow"
tags = ["rust", "parser", "bugfix", "testing-churn"]
change_class = "small"
verification_envelope = "small"
fixture_digest = "sha256:179f4dd62402cfc7dd997567d92a508e9545bcafba5960116b94866a70ec0c68"

[agent]
timeout_sec = 900.0
network_mode = "allowlist"
allowed_hosts = []

[environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []
workdir = "/app"

[verifier]
timeout_sec = 240.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
