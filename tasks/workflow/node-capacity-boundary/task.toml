  { source = "/logs/agent/trajectory.json", destination = "trajectory.json" },
]

[task]
name = "studio-moser/node-capacity-boundary"
version = "1.0.0"
description = "Inclusive capacity boundary"
authors = [{ name = "Studio Moser" }]
keywords = ["javascript", "atomic", "testing"]

[metadata]
difficulty = "easy"
category = "workflow"
tags = ["javascript", "atomic", "testing"]
