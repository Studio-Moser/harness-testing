schema_version = "1.4"

artifacts = [
  { source = "/app", destination = "workspace", exclude = [".git", "node_modules", "target"] },
  { source = "/logs/agent/trajectory.json", destination = "trajectory.json" },
]

[task]
name = "studio-moser/react-accent-polish"
version = "1.0.0"
description = "Measures whether a coding agent verifies one React styling change without an unnecessary full suite."
authors = [{ name = "Studio Moser" }]
keywords = ["react", "typescript", "polish", "testing-churn"]

[metadata]
difficulty = "easy"
category = "workflow"
tags = ["react", "typescript", "polish", "testing-churn"]
change_class = "polish"
verification_envelope = "polish"
fixture_digest = "sha256:8b0ea89272c914340517fbf5337a53bc3f26d481d9fbec7e56ec9c6815a6bc67"

[agent]
timeout_sec = 900.0
network_mode = "allowlist"
allowed_hosts = []

[environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []
workdir = "/app"

[verifier]
timeout_sec = 180.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
