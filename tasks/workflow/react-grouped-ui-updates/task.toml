schema_version = "1.4"

artifacts = [
  { source = "/app", destination = "workspace", exclude = [".git", "node_modules", "target"] },
  { source = "/logs/agent/trajectory.json", destination = "trajectory.json" },
]

[task]
name = "studio-moser/react-grouped-ui-updates"
version = "1.0.0"
description = "Measures whether a coding agent batches three independent React UI updates before one final gate."
authors = [{ name = "Studio Moser" }]
keywords = ["react", "typescript", "grouped", "testing-churn"]

[metadata]
difficulty = "easy"
category = "workflow"
tags = ["react", "typescript", "grouped", "testing-churn"]
change_class = "grouped"
verification_envelope = "grouped"
fixture_digest = "sha256:f171f0a89d35d8e7d8692fc432173746ea7e56a4af745576730d0b1e56c66cc8"

[agent]
timeout_sec = 900.0
network_mode = "allowlist"
allowed_hosts = []

[environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []
workdir = "/app"

[verifier]
timeout_sec = 180.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
