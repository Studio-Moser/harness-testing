schema_version = "1.4"

artifacts = [
  { source = "/app", destination = "workspace", exclude = [".git", "node_modules", "target"] },
  { source = "/logs/agent/trajectory.json", destination = "trajectory.json" },
]

[task]
name = "studio-moser/react-saved-view-feature"
version = "1.0.0"
description = "Measures whether a coding agent completes a persisted React view feature with focused checks and one final gate."
authors = [{ name = "Studio Moser" }]
keywords = ["react", "typescript", "local-storage", "testing-churn"]

[metadata]
difficulty = "easy"
category = "workflow"
tags = ["react", "typescript", "local-storage", "testing-churn"]
change_class = "feature"
verification_envelope = "feature"
fixture_digest = "sha256:2de1ed298aee848f882a4589149ae80b3d137b68ebf8ebefb6b4f4556a6f6e63"

[agent]
timeout_sec = 900.0
network_mode = "allowlist"
allowed_hosts = []

[environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []
workdir = "/app"

[verifier]
timeout_sec = 180.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
