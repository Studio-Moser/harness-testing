schema_version = "1.4"

artifacts = [
  { source = "/app", destination = "workspace", exclude = [".git", "node_modules", "target"] },
  { source = "/logs/agent/trajectory.json", destination = "trajectory.json" },
]

[task]
name = "studio-moser/node-docs-flag-zsh"
version = "1.0.0"
description = "Docs flag rename in a zsh shell"
authors = [{ name = "Studio Moser" }]
keywords = ["javascript", "docs", "zsh"]

[metadata]
difficulty = "easy"
category = "workflow"
tags = ["javascript", "docs", "zsh"]
change_class = "small"
verification_envelope = "small"
fixture_digest = "sha256:5e88988625e33ff169948782b7f37af6d5d8661993166fcb6d9e98191cad46a6"

[agent]
timeout_sec = 900.0
network_mode = "allowlist"
allowed_hosts = []

[environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []
workdir = "/app"

[verifier]
timeout_sec = 180.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
