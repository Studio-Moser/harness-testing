schema_version = "1.4"

artifacts = [
  { source = "/app", destination = "workspace", exclude = [".git", "node_modules", "target"] },
  { source = "/logs/agent/trajectory.json", destination = "trajectory.json" },
]

[task]
name = "studio-moser/node-export-clear"
version = "1.0.0"
description = "Bounded record export with a shared serializer and privacy boundaries."
authors = [{ name = "Studio Moser" }]
keywords = ["html", "javascript", "accessibility", "testing-churn"]

[metadata]
difficulty = "easy"
category = "workflow"
tags = ["html", "javascript", "accessibility", "testing-churn"]
change_class = "small"
verification_envelope = "small"
fixture_digest = "sha256:4fd273498c2eab59693cd7b2bae93a0da92ab6537d19162bdc12494a47c3ef06"

[agent]
timeout_sec = 900.0
network_mode = "allowlist"
allowed_hosts = []

[environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []
workdir = "/app"

[verifier]
timeout_sec = 180.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
