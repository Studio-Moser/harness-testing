schema_version = "1.4"

artifacts = [
  { source = "/app", destination = "workspace", exclude = [".git", "node_modules", "target"] },
  { source = "/logs/agent/trajectory.json", destination = "trajectory.json" },
]

[task]
name = "studio-moser/static-workspace-design-system-polish"
version = "1.0.0"
description = "Multi-page workspace visual-system polish"
authors = [{ name = "Studio Moser" }]
keywords = ["html", "javascript", "accessibility", "testing-churn"]

[metadata]
difficulty = "hard"
category = "workflow"
tags = ["html", "javascript", "accessibility", "testing-churn"]
change_class = "feature"
verification_envelope = "small"
fixture_digest = "sha256:98aff4737e4cf290cc2ea37dee2febd23cb1c1eaa133f205098fef66c9ca6451"

[agent]
timeout_sec = 900.0
network_mode = "allowlist"
allowed_hosts = []

[environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []
workdir = "/app"

[verifier]
timeout_sec = 180.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
