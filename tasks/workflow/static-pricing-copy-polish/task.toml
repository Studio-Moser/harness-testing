schema_version = "1.4"

artifacts = [
  { source = "/app", destination = "workspace", exclude = [".git", "node_modules", "target"] },
  { source = "/logs/agent/trajectory.json", destination = "trajectory.json" },
]

[task]
name = "studio-moser/static-pricing-copy-polish"
version = "1.0.0"
description = "Measures whether a coding agent uses direct proof for a static-site copy and token polish change."
authors = [{ name = "Studio Moser" }]
keywords = ["html", "css", "polish", "testing-churn"]

[metadata]
difficulty = "easy"
category = "workflow"
tags = ["html", "css", "polish", "testing-churn"]
change_class = "polish"
verification_envelope = "polish"
fixture_digest = "sha256:39d924332609b419077767e2562a814dffa834651dc46518a88a644cf8bcd9ee"

[agent]
timeout_sec = 900.0
network_mode = "allowlist"
allowed_hosts = []

[environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []
workdir = "/app"

[verifier]
timeout_sec = 180.0
environment_mode = "separate"
network_mode = "no-network"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
